name: 데이터 갱신

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 오전 7시(한국 시간) = 22:00 UTC
  workflow_dispatch:         # Actions 탭에서 직접 실행하는 버튼

permissions:
  contents: write            # 갱신된 data/ 파일을 저장소에 커밋하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 경기 데이터 수집 (Daum 스포츠)
        run: python -X utf8 collect.py --out data

      - name: 오늘 확률 기록
        run: node snapshot.mjs

      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
